name: Test reusable workflow
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test-workflow:
    name: Test SonarSource/gh-action_sbom on alpine:latest
    uses: ./.github/workflows/workflow.yml
    with:
      image: alpine:latest
      filename: test-workflow-bom.json
      upload-artifact: true
      upload-release-assets: true
  test2-workflow:
    name: Test SonarSource/gh-action_sbom on alpine:latest
    uses: ./.github/workflows/workflow.yml
    with:
      image: alpine:latest
      filename: test-workflow-bom.json
      upload-artifact: false
      upload-release-assets: false

  test-upload-workflow:
    name: Test upload-release-assets (workflow)
    uses: ./.github/workflows/workflow.yml
    with:
      image: alpine:latest
      filename: test-workflow-upload-bom.json
      upload-artifact: true
      upload-release-assets: true
      release-tag: test/ci-sbom-wf-${{ github.run_id }}
    permissions:
      contents: write
      id-token: write

  verify-and-cleanup:
    name: Verify and cleanup upload test
    needs: test-upload-workflow
    if: always()
    permissions:
      contents: write
    runs-on: github-ubuntu-latest-s
    steps:
      - name: Verify SBOM attached to release
        if: needs.test-upload-workflow.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: test/ci-sbom-wf-${{ github.run_id }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name]')
          echo "Release assets: $assets"
          echo "$assets" | jq -e 'map(select(. == "test-workflow-upload-bom.json")) | length > 0'
          echo "$assets" | jq -e 'map(select(. == "test-workflow-upload-bom.json.asc")) | length > 0'
      - name: Cleanup temp draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: test/ci-sbom-wf-${{ github.run_id }}
        run: gh release delete "$TAG" --yes || echo "::warning::Could not delete the temp draft release $TAG"
